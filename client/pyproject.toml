[project]
name = "cinema-client"
version = "1.0.0"
description = "Кинотеатр — билеты и бронирование"
requires-python = ">=3.10"
dependencies = ["flet==0.84.0", "httpx==0.28.1"]

[tool.flet]
org = "ru.coursework"
product = "Кинотеатр"
company = "Cinema"
copyright = "Учебный проект"

[tool.flet.app]
path = "src"

[tool.flet.android.permission]
"android.permission.INTERNET" = true

[tool.flet.android.manifest_application]
usesCleartextTraffic = "true"
